<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кастомный ИИ Классификатор</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f5f7; display: flex; justify-content: center; padding: 40px; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); max-width: 450px; width: 100%; text-align: center; }
        .status { font-weight: bold; margin-bottom: 20px; padding: 6px; border-radius: 4px; display: inline-block; font-size: 0.9em; }
        .connecting { background: #fef3c7; color: #d97706; }
        .connected { background: #dcfce7; color: #15803d; }
        .error { background: #fee2e2; color: #b91c1c; }
        .upload-area { border: 2px dashed #cbd5e1; padding: 25px; border-radius: 8px; cursor: pointer; background: #f8fafc; min-height: 100px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #imageInput { display: none; }
        #preview { max-width: 100%; max-height: 200px; margin-top: 15px; border-radius: 6px; display: none; }
        button { background: #007bff; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 15px; }
        button:disabled { background: #cbd5e1; cursor: not-allowed; }
        #result { margin-top: 20px; padding: 12px; background: #f1f5f9; border-radius: 6px; font-family: monospace; white-space: pre-wrap; text-align: left; max-height: 200px; overflow-y: auto; }
    </style>

    <!-- Подключаем JS-клиент Gradio -->
    <script type="module">
        import { Client, handle_file } from "https://jsdelivr.net";

        // Проверьте, активна ли ещё эта ссылка в вашем Python-терминале/блокноте!
        const GRADIO_URL = "https://gradio.live"; 
        let client;

        async function init() {
            const statusDiv = document.getElementById('status');
            const resultDiv = document.getElementById('result');
            try {
                client = await Client.connect(GRADIO_URL);
                statusDiv.innerText = "Статус: Подключено к API";
                statusDiv.className = "status connected";
                document.getElementById('submitBtn').disabled = false;
            } catch (e) {
                console.error(e);
                statusDiv.innerText = "Ошибка подключения!";
                statusDiv.className = "status error";
                resultDiv.innerText = "Критическая ошибка инициализации: " + e.message + "\nВозможно, ссылка .gradio.live устарела или закрыта в Python.";
            }
        }

        async function sendPredict() {
            const fileInput = document.getElementById('imageInput');
            const resultDiv = document.getElementById('result');
            
            if (!fileInput.files || fileInput.files.length === 0) {
                alert("Сначала выберите изображение!");
                return;
            }

            resultDiv.innerText = "🤖 Нейросеть обрабатывает изображение...";
            document.getElementById('submitBtn').disabled = true;

            try {
                // ИСПРАВЛЕНО: Передаем конкретный первый файл, а не весь список файлов
                const imageFile = handle_file(fileInput.files[0]);

                const result = await client.predict("/predict", {
                    img: imageFile,
                });

                resultDiv.innerText = "Ответ модели:\n" + JSON.stringify(result.data, null, 2);
            } catch (error) {
                console.error(error);
                resultDiv.innerText = "❌ Ошибка при вызове API:\n" + error.message;
            } finally {
                document.getElementById('submitBtn').disabled = false;
            }
        }

        // Настройка событий вынесена отдельно для стабильности
        window.onload = function() {
            init();
            
            const zone = document.getElementById('uploadZone');
            const input = document.getElementById('imageInput');
            const preview = document.getElementById('preview');
            
            if (zone && input) {
                zone.onclick = function() {
                    input.click();
                };
                
                input.onchange = function(e) {
                    if (input.files && input.files[0]) {
                        preview.src = URL.createObjectURL(input.files[0]);
                        preview.style.display = 'block';
                    }
                };
            }
            
            document.getElementById('submitBtn').onclick = sendPredict;
        };
    </script>
</head>
<body>

    <div class="card">
        <h2>Мой AI Сервис</h2>
        <div id="status" class="status connecting">Подключение к API...</div>
        
        <div class="upload-area" id="uploadZone">
            <p>📁 Нажмите здесь для загрузки фото</p>
            <input type="file" id="imageInput" accept="image/*">
            <img id="preview" alt="Превью">
        </div>
        
        <button id="submitBtn" disabled>Классифицировать</button>
        <div id="result">Здесь появится результат или лог ошибки</div>
    </div>

</body>
</html>
