<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Классификатор Изображений</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #f4f5f7; 
            display: flex; 
            justify-content: center; 
            padding: 40px; 
            margin: 0;
        }
        .card { 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            max-width: 450px; 
            width: 100%; 
            text-align: center; 
        }
        h2 { color: #1e293b; margin-top: 0; margin-bottom: 8px; }
        .subtitle { color: #64748b; font-size: 14px; margin-bottom: 20px; }
        
        .upload-area { 
            border: 2px dashed #cbd5e1; 
            padding: 25px; 
            border-radius: 8px; 
            cursor: pointer; 
            background: #f8fafc; 
            min-height: 140px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            margin-bottom: 15px; 
            transition: border-color 0.2s, background-color 0.2s; 
        }
        .upload-area:hover { border-color: #007bff; background-color: #f0f7ff; }
        #imageInput { display: none; }
        #preview { max-width: 100%; max-height: 200px; margin-top: 15px; border-radius: 6px; display: none; border: 1px solid #e2e8f0; }
        
        button { 
            background: #007bff; 
            color: white; 
            border: none; 
            padding: 14px; 
            border-radius: 8px; 
            cursor: pointer; 
            width: 100%; 
            font-weight: bold; 
            font-size: 16px; 
            transition: background 0.2s;
        }
        button:hover { background: #0056b3; }
        button:disabled { background: #cbd5e1; cursor: not-allowed; }
        
        #result { 
            margin-top: 20px; 
            padding: 15px; 
            background: #f1f5f9; 
            border-radius: 8px; 
            font-family: monospace; 
            white-space: pre-wrap; 
            text-align: left; 
            max-height: 200px; 
            overflow-y: auto; 
            color: #334155;
            font-size: 13px;
            border: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Мой AI Сервис</h2>
        <p class="subtitle">Загрузите фото с устройства для отправки в модель через API</p>
        
        <div class="upload-area" id="uploadZone">
            <p id="uploadText">📸 Нажмите сюда для загрузки фото</p>
            <input type="file" id="imageInput" accept="image/*">
            <img id="preview" alt="Превью">
        </div>
        
        <button id="submitBtn">Классифицировать</button>
        <div id="result">Результат анализа появится здесь...</div>
    </div>

    <script>
        // Ваша рабочая ссылка Gradio
        const GRADIO_URL = "https://gradio.live"; 

        const zone = document.getElementById('uploadZone');
        const input = document.getElementById('imageInput');
        const preview = document.getElementById('preview');
        const uploadText = document.getElementById('uploadText');
        const submitBtn = document.getElementById('submitBtn');
        const resultDiv = document.getElementById('result');

        // Открытие выбора файла
        zone.addEventListener('click', () => {
            input.click();
        });

        // Отображение превью после выбора файла
        input.addEventListener('change', () => {
            if (input.files && input.files[0]) {
                preview.src = URL.createObjectURL(input.files[0]);
                preview.style.display = 'block';
                uploadText.style.display = 'none';
            }
        });

        async function sendPredict() {
            if (!input.files || input.files.length === 0) {
                alert("Пожалуйста, сначала загрузите картинку!");
                return;
            }

            resultDiv.innerText = "⏳ Шаг 1: Загрузка файла на сервер Gradio...";
            submitBtn.disabled = true;

            try {
                // --- ШАГ 1: Отправка файла через FormData ---
                const formData = new FormData();
                formData.append('files', input.files[0]);

                const uploadResponse = await fetch(`${GRADIO_URL}/gradio_api/upload`, {
                    method: 'POST',
                    body: formData
                });

                if (!uploadResponse.ok) {
                    throw new Error(`Ошибка загрузки файла на сервер: ${uploadResponse.status}`);
                }

                const uploadResult = await uploadResponse.json();
                const serverFilePath = uploadResult[0]; 

                resultDiv.innerText = "🤖 Шаг 2: Файл на сервере! Запуск классификации...";

                // --- ШАГ 2: Передача пути в JSON-запросе ---
                const predictResponse = await fetch(`${GRADIO_URL}/gradio_api/call/predict`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        data: [
                            {
                                "path": serverFilePath,
                                "meta": { "_type": "gradio.FileData" }
                            }
                        ]
                    })
                });

                if (!predictResponse.ok) {
                    throw new Error(`Сервер отклонил запрос классификации: ${predictResponse.status}`);
                }

                // ИСПРАВЛЕНО: убрана двойная переменная из присвоения
                const jsonResult = await predictResponse.json();
                
                // ШАГ 3: Получение ответа из очереди задач
                if (jsonResult.event_id) {
                    resultDiv.innerText = "Файл успешно обработан! Получение ответа...\n";
                    
                    const streamResponse = await fetch(`${GRADIO_URL}/gradio_api/call/predict/${jsonResult.event_id}`);
                    const textData = await streamResponse.text();
                    
                    parseGradioResponse(textData);
                } else {
                    resultDiv.innerText = "Ответ модели:\n" + JSON.stringify(jsonResult, null, 2);
                }

            } catch (error) {
                console.error(error);
                resultDiv.innerText = "❌ Ошибка выполнения API:\n" + error.message;
            } finally {
                submitBtn.disabled = false;
            }
        }

        function parseGradioResponse(rawText) {
            try {
                const lines = rawText.split('\n');
                for (let line of lines) {
                    if (line.startsWith('data: ')) {
                        const cleanJson = JSON.parse(line.replace('data: ', ''));
                        
                        if (cleanJson.event === "error") {
                            resultDiv.innerText = "❌ Ошибка модели:\n" + JSON.stringify(cleanJson.data, null, 2);
                            return;
                        }
                        
                        if (cleanJson.event === "complete" && cleanJson.data) {
                            resultDiv.innerText = "Результат нейросети:\n" + JSON.stringify(cleanJson.data, null, 2);
                            return;
                        }
                    }
                }
                resultDiv.innerText = "Ответ модели:\n" + rawText;
            } catch (e) {
                resultDiv.innerText = "Ответ модели:\n" + rawText;
            }
        }

        submitBtn.onclick = sendPredict;
    </script>

</body>
</html>
