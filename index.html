<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кастомный ИИ Классификатор</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #f4f5f7; 
            display: flex; 
            justify-content: center; 
            padding: 40px; 
        }
        .card { 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            max-width: 500px; 
            width: 100%; 
            text-align: center; 
        }
        h2 { color: #1e293b; margin-top: 0; margin-bottom: 5px; }
        .description { color: #64748b; font-size: 14px; margin-bottom: 25px; }

        /* НАСТРОЙКА ВНЕШНЕГО ВИДА КОМПОНЕНТА GRADIO */
        gradio-app {
            border-radius: 8px;
            overflow: hidden;
        }

        /* Хитрый трюк: скрываем встроенные футеры Gradio (ссылки, логотипы, лишний текст) */
        gradio-app::part(footer) {
            display: none !important;
        }
        gradio-app::part(logo) {
            display: none !important;
        }
    </style>

    <!-- Подключаем официальный скрипт веб-компонентов Gradio -->
    <script type="module" src="https://amazonaws.com"></script>
</head>
<body>

    <div class="card">
        <h2>Мой AI Сервис</h2>
        <p class="description">Загрузите изображение с вашего устройства для мгновенной классификации</p>
        
        <!-- Встраиваем само приложение. Оно автоматически создаст кнопку загрузки файла и кнопку отправки -->
        <!-- Атрибут src указывает на вашу точную рабочую ссылку -->
        <gradio-app src="https://d8090ba6c5d8d9c9ac.gradio.live/"></gradio-app>
    </div>

</body>
</html>
