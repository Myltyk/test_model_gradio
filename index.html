<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ИИ Классификатор по URL</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f5f7; display: flex; justify-content: center; padding: 40px; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); max-width: 500px; width: 100%; text-align: center; }
        h2 { color: #1e293b; margin-top: 0; }
        
        /* Поле ввода URL */
        .url-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        .url-input:focus { border-color: #3b82f6; outline: none; }
        
        #preview { max-width: 100%; max-height: 200px; margin: 10px 0; border-radius: 6px; display: none; border: 1px solid #e2e8f0; }
        
        button { background: #007bff; color: white; border: none; padding: 14px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; font-size: 16px; }
        button:disabled { background: #cbd5e1; cursor: not-allowed; }
        
        #result { margin-top: 20px; padding: 15px; background: #f1f5f9; border-radius: 8px; font-family: monospace; white-space: pre-wrap; text-align: left; max-height: 250px; overflow-y: auto; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Кастомный ИИ Сервис (По URL)</h2>
        <p style="color: #64748b; font-size: 14px; margin-bottom: 20px;">Вставьте прямую ссылку на изображение из интернета для его классификации</p>
        
        <!-- Поле для ввода ссылки -->
        <input type="text" id="imgUrl" class="url-input" placeholder="https://example.com">
        
        <img id="preview" alt="Превью изображения">
        
        <button id="submitBtn">Классифицировать</button>
        
        <div id="result">Результат анализа появится здесь...</div>
    </div>

    <script type="module">
        // Используем стандартный нативный fetch вместо капризного клиента Gradio
        // Это гарантирует, что интерфейс никогда не зависнет при загрузке страницы
        const GRADIO_URL = "https://gradio.live"; 

        const urlInput = document.getElementById('imgUrl');
        const preview = document.getElementById('preview');
        const submitBtn = document.getElementById('submitBtn');
        const resultDiv = document.getElementById('result');

        // Показ превью картинки при вводе URL
        urlInput.addEventListener('input', () => {
            const url = urlInput.value.trim();
            if (url) {
                preview.src = url;
                preview.style.display = 'block';
            } else {
                preview.style.display = 'none';
            }
        });

        // Прямой запрос к API Gradio v2 без сторонних библиотек
        async function sendPredict() {
            const url = urlInput.value.trim();
            if (!url) {
                alert("Пожалуйста, введите URL картинки!");
                return;
            }

            resultDiv.innerText = "🤖 Нейросеть обрабатывает изображение по ссылке...";
            submitBtn.disabled = true;

            try {
                // Точно симулируем JSON-запрос к вашей модели на основе вашего скриншота
                const response = await fetch(`${GRADIO_URL}/gradio_api/call/predict`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        data: [ url ] // Передаем URL-строку напрямую в массив аргументов
                    })
                });

                if (!response.ok) {
                    throw new Error(`Ошибка сервера: ${response.status}`);
                }

                const jsonResult = await response.json();
                
                // Для Gradio 4+ ответ часто возвращает event_id. Попробуем прочесть данные:
                if (jsonResult.event_id) {
                    resultDiv.innerText = "Запрос принят сервером!\nОжидание финального ответа...\n\n";
                    
                    // Делаем второй обязательный GET запрос для получения результата (как написано у вас на скрине)
                    const streamResponse = await fetch(`${GRADIO_URL}/gradio_api/call/predict/${jsonResult.event_id}`);
                    const textData = await streamResponse.text();
                    
                    // Форматируем и выводим ответ
                    resultDiv.innerText = "Ответ модели:\n" + textData;
                } else {
                    resultDiv.innerText = "Ответ модели:\n" + JSON.stringify(jsonResult, null, 2);
                }

            } catch (error) {
                console.error(error);
                resultDiv.innerText = "❌ Ошибка вызова API:\n" + error.message + 
                "\n\nУбедитесь, что ссылка .gradio.live активна в вашем Python блокноте.";
            } finally {
                submitBtn.disabled = false;
            }
        }

        submitBtn.addEventListener('click', sendPredict);
    </script>

</body>
</html>
